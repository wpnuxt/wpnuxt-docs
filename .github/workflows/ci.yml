name: ci

on:
  push:
  workflow_dispatch:
  # Sent by wpnuxt/wpnuxt when docs/content changes on main: the content is fetched at build time
  repository_dispatch:
    types: [docs-content]

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check
        run: pnpm run check

  # Only on main: builds the image, smoke-tests it, pushes it to the self-hosted registry and
  # triggers the Coolify redeploy of wpnuxt.com.
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: [ci]
    if: github.ref == 'refs/heads/main'
    # Secrets live in the "production" environment, which only main may deploy to
    environment:
      name: production
      url: https://wpnuxt.com
    concurrency:
      group: production
      cancel-in-progress: true
    env:
      IMAGE: registry.apps.vernaillen.dev/wpnuxt-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: registry.apps.vernaillen.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # load: true keeps the image local so it can be smoke-tested before pushing
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # The build fetches remote docs content and the npm version, so it must never come from cache
          build-args: CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 "${IMAGE}:${{ github.sha }}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = "1" ]; then
            curl -fsS -o /dev/null http://localhost:3000/getting-started || ok=0
            curl -fsS -o /dev/null http://localhost:3000/plio/js/script.js || ok=0
            # The MCP endpoint answers a plain GET with a 4xx, but must not be missing or crash
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/mcp)
            { [ "$code" != "404" ] && [ "$code" -lt 500 ]; } || ok=0
          fi
          echo "----- container logs -----"; docker logs smoke || true
          docker rm -f smoke >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "::error::Smoke test failed"; exit 1; }

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      # Coolify pulls :latest but does not redeploy on its own. COOLIFY_DEPLOY_URL is the full
      # deploy endpoint incl. ?uuid=<resource-uuid>.
      - name: Trigger Coolify redeploy
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.COOLIFY_DEPLOY_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
