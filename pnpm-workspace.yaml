# pnpm 10+ reads this from pnpm-workspace.yaml, not .npmrc.
# Required so transitive deps (@nuxt/kit, zod) resolve for jiti/@nuxt/content during `nuxt prepare`.
shamefullyHoist: true

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
